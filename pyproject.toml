[project]
name = "spyion-client"
version = "1.0.1"
description = "Notebook/IDE client for the read-only Spyion Extract API."
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=14",
    "requests>=2.31",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["spyion_client"]